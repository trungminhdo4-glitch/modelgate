name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: install gitleaks (version pinned to the locally verified release)
        run: go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: scan full history
        run: gitleaks git . --redact --no-banner --exit-code 1
