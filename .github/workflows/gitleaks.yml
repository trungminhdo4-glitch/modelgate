name: Gitleaks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: install gitleaks (version pinned to the locally verified release)
        run: |
          # The repository lives at github.com/gitleaks/gitleaks, but the Go
          # module still declares github.com/zricethezav/gitleaks/v8 - go
          # install requires the declared path. Verified locally: install
          # exits 0 and produces the 'gitleaks' binary.
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: scan full history
        run: gitleaks git . --redact --no-banner --exit-code 1
